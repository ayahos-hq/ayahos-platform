name: Provisional platform source and bridge verification

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review, converted_to_draft]
    paths:
      - ".github/workflows/platform-isolation.yml"
      - ".gitattributes"
      - "tests/**"
      - "ci/worker-build/**"
      - ".octopus/**"
      - "deploy/**"
      - "scripts/ci/**"
      - "scripts/verify-platform.py"
      - "scripts/verify-release-manifest.py"
      - "scripts/audit-repo-drift.py"
      - "scripts/test_audit_repo_drift.py"
      - "scripts/test_verify_release_manifest.py"
      - "scripts/assemble-hq-workspace.py"
      - "scripts/test_assemble_hq_workspace.py"
      - "scripts/prepare-hq-rag-overlay.py"
      - "scripts/test_prepare_hq_rag_overlay.py"
      - "release-manifest.json"
      - "MIGRATION-GATES.md"
      - "README.md"
      - "SOURCE-PROVENANCE.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    # Draft PRs do not allocate runners; ready-for-review does full validation.
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Confirm immutable platform source and mandatory Octopus topology
        run: python3 scripts/verify-platform.py
      - name: Verify preview-only Worker Builds guard regression tests
        run: python3 -m unittest discover -s ci/worker-build -p "test_*.py" -v
      - name: Verify five-repository candidate manifest
        run: python3 scripts/verify-release-manifest.py
      - name: Test fail-closed immutable HQ source assembly (offline)
        run: python3 -m unittest discover -s scripts -p "test_assemble_hq_workspace.py" -v
      - name: Test isolated cross-repository Ruby RAG schema overlay (offline)
        run: python3 -m unittest discover -s scripts -p "test_prepare_hq_rag_overlay.py" -v
      - name: Regression-test exact-SHA five-repo workspace (offline)
        run: python3 -m unittest discover -s scripts -p "test_verify_release_manifest.py" -v
      - name: Unit-test three-way repository drift classifier (offline)
        run: python3 -m unittest discover -s scripts -p "test_audit_repo_drift.py" -v
      - name: Check shell syntax without running release scripts
        run: find scripts/ci -type f -name '*.sh' -exec bash -n '{}' \;
      - name: Guard HQ Worker preview against production KV exposure (offline)
        run: python3 -m unittest discover -s scripts/ci/tests -p "test_hq_worker_build.py" -v
      - name: Verify private OSS observability staging contract (offline only)
        env:
          AYAHOS_OTEL_COLLECTOR_IMAGE: "example/otel@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"
          AYAHOS_PROMETHEUS_IMAGE: "example/prometheus@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"
          AYAHOS_LOKI_IMAGE: "example/loki@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"
          AYAHOS_GRAFANA_IMAGE: "example/grafana@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"
          AYAHOS_GRAFANA_ADMIN_PASSWORD_FILE: "/tmp/ayahos-staging-ci-placeholder"
        run: |
          umask 077
          printf '%s' "CI synthetic only, not a credential" > "$AYAHOS_GRAFANA_ADMIN_PASSWORD_FILE"
          python3 -m unittest discover -s deploy/observability_staging/tests -p 'test_*.py' -v
          python3 deploy/observability_staging/gate.py
      - name: Setup Node 22 for dependency-free bridge tests
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify mocked GitHub/Octopus webhook integration
        run: node --test deploy/octopus-github-bridge/test/worker.test.js
