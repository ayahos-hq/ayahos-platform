name: Provisional platform source and bridge verification

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/platform-isolation.yml"
      - ".octopus/**"
      - "deploy/**"
      - "scripts/ci/**"
      - "scripts/verify-platform.py"
      - "scripts/verify-release-manifest.py"
      - "release-manifest.json"
      - "MIGRATION-GATES.md"
      - "SOURCE-PROVENANCE.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: provisional-platform-verification
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Confirm immutable platform source and mandatory Octopus topology
        run: python3 scripts/verify-platform.py
      - name: Verify five-repository candidate manifest
        run: python3 scripts/verify-release-manifest.py
      - name: Check shell syntax without running release scripts
        run: find scripts/ci -type f -name '*.sh' -exec bash -n '{}' \;
      - name: Setup Node 22 for dependency-free bridge tests
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify mocked GitHub/Octopus webhook integration
        run: node --test deploy/octopus-github-bridge/test/worker.test.js
