name: Provisional platform source and bridge verification

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/platform-isolation.yml"
      - ".octopus/**"
      - "deploy/**"
      - "scripts/ci/**"
      - "scripts/verify-platform.py"
      - "scripts/verify-release-manifest.py"
      - "scripts/audit-repo-drift.py"
      - "scripts/test_audit_repo_drift.py"
      - "release-manifest.json"
      - "MIGRATION-GATES.md"
      - "SOURCE-PROVENANCE.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: provisional-platform-verification
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Confirm immutable platform source and mandatory Octopus topology
        run: python3 scripts/verify-platform.py
      - name: Verify five-repository candidate manifest
        run: python3 scripts/verify-release-manifest.py
      - name: Unit-test three-way repository drift classifier (offline)
        run: python3 -m unittest discover -s scripts -p "test_audit_repo_drift.py" -v
      - name: Check shell syntax without running release scripts
        run: find scripts/ci -type f -name '*.sh' -exec bash -n '{}' \;
      - name: Setup Node 22 for dependency-free bridge tests
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify mocked GitHub/Octopus webhook integration
        run: node --test deploy/octopus-github-bridge/test/worker.test.js

  verify-hq-heads:
    name: Verify declared HQ main heads (manual)
    # The default GITHUB_TOKEN is repository-scoped. This cross-repository
    # audit is manual until the organization supplies HQ_READ_TOKEN as a
    # repository secret; never silently downgrade it to one checkout.
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - name: Checkout platform source
        uses: actions/checkout@v4
        with:
          path: ayahos-platform
          persist-credentials: false
      - name: Checkout the four sibling HQ repositories
        shell: bash
        env:
          HQ_READ_TOKEN: ${{ secrets.HQ_READ_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${HQ_READ_TOKEN:-}" ]]; then
            echo "::error::HQ_READ_TOKEN is required to compare private sibling repositories"
            exit 1
          fi
          for repo in ayahos-site ayahos-core ayahos-admin ayahos-workloads; do
            git -c http.extraheader="AUTHORIZATION: bearer ${HQ_READ_TOKEN}" clone --depth 1 --branch main \
              "https://github.com/ayahos-hq/${repo}.git" "${repo}"
          done
      - name: Verify manifest against all five origin main refs
        run: python3 ayahos-platform/scripts/verify-release-manifest.py --workspace-root "$GITHUB_WORKSPACE"
