name: Provisional platform source and bridge verification

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/platform-isolation.yml"
      - ".octopus/**"
      - "deploy/**"
      - "scripts/ci/**"
      - "scripts/verify-platform.py"
      - "scripts/verify-release-manifest.py"
      - "scripts/audit-repo-drift.py"
      - "scripts/test_audit_repo_drift.py"
      - "scripts/bootstrap-linux-node.sh"
      - "scripts/test_bootstrap_linux_node.py"
      - "docs/linux-dev-bootstrap.md"
      - "scripts/test_verify_release_manifest.py"
      - "scripts/assemble-hq-workspace.py"
      - "scripts/test_assemble_hq_workspace.py"
      - "scripts/prepare-hq-rag-overlay.py"
      - "scripts/test_prepare_hq_rag_overlay.py"
      - "release-manifest.json"
      - "MIGRATION-GATES.md"
      - "README.md"
      - "SOURCE-PROVENANCE.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Confirm immutable platform source and mandatory Octopus topology
        run: python3 scripts/verify-platform.py
      - name: Verify five-repository candidate manifest
        run: python3 scripts/verify-release-manifest.py
      - name: Test fail-closed immutable HQ source assembly (offline)
        run: python3 -m unittest discover -s scripts -p "test_assemble_hq_workspace.py" -v
      - name: Test isolated cross-repository Ruby RAG schema overlay (offline)
        run: python3 -m unittest discover -s scripts -p "test_prepare_hq_rag_overlay.py" -v
      - name: Regression-test exact-SHA five-repo workspace (offline)
        run: python3 -m unittest discover -s scripts -p "test_verify_release_manifest.py" -v
      - name: Unit-test three-way repository drift classifier (offline)
        run: python3 -m unittest discover -s scripts -p "test_audit_repo_drift.py" -v
      - name: Validate Linux bootstrap without performing an installation
        run: |
          bash -n scripts/bootstrap-linux-node.sh
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s scripts -p "test_bootstrap_linux_node.py" -v
      - name: Check shell syntax without running release scripts
        run: find scripts/ci -type f -name '*.sh' -exec bash -n '{}' \;
      - name: Setup Node 22 for dependency-free bridge tests
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify mocked GitHub/Octopus webhook integration
        run: node --test deploy/octopus-github-bridge/test/worker.test.js
