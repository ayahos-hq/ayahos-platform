name: Octopus status relay

# Manual only, for now. The live Octopus bridge Worker is not configured for this repository (it
# answers every push with "ignored: push is not for the configured repository" and
# GET /status/<sha> returns 404), so an automatic pull_request trigger would poll for 25 minutes on
# every PR and then publish octopus/verify=error. Restore the pull_request trigger only after the
# owner has reconfigured the Worker; see deploy/octopus-github-bridge/README.md.
on:
  workflow_dispatch:
    inputs:
      sha:
        description: Full 40-character commit SHA to publish octopus/verify for (default is the dispatched ref's head)
        required: false
        type: string

# Only people with write access can dispatch, and the relay script is checked out from the ref they
# select, so the token's statuses: write scope is never exposed to an unreviewed pull request.
permissions:
  contents: read
  statuses: write

concurrency:
  group: octopus-status-${{ inputs.sha || github.sha }}
  cancel-in-progress: true

jobs:
  relay:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Poll Octopus bridge and publish commit status
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ inputs.sha || github.sha }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
          OCTOPUS_STATUS_URL: https://ayahos-octopus-github-bridge.fuaadabdullah.workers.dev
        run: node scripts/ci/octopus_status_relay.mjs
