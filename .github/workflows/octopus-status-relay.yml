name: Octopus status relay

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

# Fork pull requests receive a read-only token and therefore cannot publish a status;
# the required status then remains absent and the protected branch stays closed. The PR head
# checkout is needed during bootstrap because the relay script is introduced by this PR.
permissions:
  contents: read
  statuses: write

concurrency:
  group: octopus-status-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: true

jobs:
  relay:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Poll Octopus bridge and publish commit status
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.event.pull_request.head.sha }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
          OCTOPUS_STATUS_URL: https://ayahos-octopus-github-bridge.fuaadabdullah.workers.dev
        run: node scripts/ci/octopus_status_relay.mjs
