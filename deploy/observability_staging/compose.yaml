# Staging-only lab. No service is publicly exposed.
# All four images MUST be supplied with reviewed @sha256 digests.
name: ayahos-otel-staging
services:
  collector:
    image: ${AYAHOS_OTEL_COLLECTOR_IMAGE:?Set an immutable collector image digest}
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./collector.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "127.0.0.1:4318:4318"
    mem_limit: 256m
    pids_limit: 128
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "2"}
    depends_on: [prometheus, loki]
  prometheus:
    image: ${AYAHOS_PROMETHEUS_IMAGE:?Set an immutable Prometheus image digest}
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=48h"
      - "--storage.tsdb.retention.size=512MB"
      - "--web.enable-remote-write-receiver"
    volumes:
      - ./prometheus.yaml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    mem_limit: 512m
    pids_limit: 128
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "2"}
  loki:
    image: ${AYAHOS_LOKI_IMAGE:?Set an immutable Loki image digest}
    command: ["-config.file=/etc/loki/config.yaml"]
    volumes:
      - ./loki.yaml:/etc/loki/config.yaml:ro
      - loki_data:/loki
    ports:
      - "127.0.0.1:3100:3100"
    mem_limit: 768m
    pids_limit: 128
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "2"}
  grafana:
    image: ${AYAHOS_GRAFANA_IMAGE:?Set an immutable Grafana image digest}
    environment:
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_SERVER_ROOT_URL: http://localhost:3000
    secrets:
      - grafana_admin_password
    volumes:
      - ./grafana/datasources.yaml:/etc/grafana/provisioning/datasources/ayahos.yaml:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    mem_limit: 512m
    pids_limit: 128
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    depends_on: [prometheus, loki]
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "2"}
secrets:
  grafana_admin_password:
    file: ${AYAHOS_GRAFANA_ADMIN_PASSWORD_FILE:?Set the path to a private secret file}
volumes:
  prometheus_data:
  loki_data:
  grafana_data:
