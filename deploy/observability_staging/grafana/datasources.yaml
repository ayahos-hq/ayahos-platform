apiVersion: 1
prune: true
datasources:
  - name: AyahOS Staging Metrics
    uid: ayahos-staging-prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
  - name: AyahOS Staging Logs
    uid: ayahos-staging-loki
    type: loki
    access: proxy
    url: http://loki:3100
    editable: false
