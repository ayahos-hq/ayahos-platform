# Metadata-only OTLP/HTTP receiver. Private collector -> local backends.
# Never add trace pipeline, debug payload exporter, or public receiver here.
receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 160
    spike_limit_mib: 48
  deltatocumulative: {}
  batch:
    timeout: 1s
    send_batch_size: 128
    send_batch_max_size: 256
exporters:
  prometheusremotewrite:
    endpoint: http://prometheus:9090/api/v1/write
    resource_to_telemetry_conversion:
      enabled: true
    remote_write_queue:
      enabled: true
      queue_size: 256
      num_consumers: 1
  otlphttp/loki:
    endpoint: http://loki:3100/otlp
service:
  pipelines:
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, deltatocumulative, batch]
      exporters: [prometheusremotewrite]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlphttp/loki]
