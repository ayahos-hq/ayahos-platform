# Cloud Run staging environment: nonsecret defaults only.
# Credentials and DATABASE_URL must never be stored in this file.
DUAL_LINEAGE_ENV: staging
DUAL_LINEAGE_DATABASE_MODE: local
DUAL_LINEAGE_RAG_ENABLED: "false"
DUAL_LINEAGE_SHADOW_ENABLED: "false"
DUAL_LINEAGE_AGENT_ENABLED: "false"
DUAL_LINEAGE_CRITIC_ENABLED: "false"
DUAL_LINEAGE_COMPUTE_ENABLED: "false"
DUAL_LINEAGE_OPERATIONAL_LEARNING_ENABLED: "false"
DUAL_LINEAGE_SPINE_RETENTION_ON_START: "false"
DUAL_LINEAGE_ALLOW_UNAUTHENTICATED_LOCAL: "false"
DUAL_LINEAGE_ALLOW_CLOUD: "false"
DUAL_LINEAGE_ALLOW_WRITES: "false"
DUAL_LINEAGE_ALLOW_EXEC: "false"
DUAL_LINEAGE_ALLOW_NETWORK: "false"
DUAL_LINEAGE_ALLOW_SECRET_READ: "false"
DUAL_LINEAGE_ALLOW_DELETE: "false"
DUAL_LINEAGE_ALLOW_EXTERNAL_SIDE_EFFECTS: "false"
DUAL_LINEAGE_RATE_LIMIT_ENABLED: "true"
DUAL_LINEAGE_MAX_TOKENS: "1024"
DUAL_LINEAGE_MAX_COST_USD: "0.00"
DUAL_LINEAGE_MAX_RUNTIME_MS: "60000"
